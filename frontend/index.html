<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物网站 - 探索你的专属好物</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Particle.js for background effects -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <!-- AOS - Animate On Scroll -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <!-- ECharts 可视化图表库 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  
  <!-- 模块化JS文件 - 按依赖顺序加载 -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cartPage.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/sell.js"></script>
  <script src="js/productManage.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- Particle Background -->
  <div id="particles-js"></div>
  
  <!-- Glass morphism header -->
  <header class="main-header glass-effect">
    <div class="header-inner">
      <div class="logo-area" data-aos="fade-right">
        <div class="logo-icon">🛍️</div>
        <span class="site-title gradient-text">CJL-SHOP</span>
      </div>
      <button class="nav-toggle neon-btn" id="nav-toggle" aria-label="打开导航">☰</button>
      <nav class="main-nav" id="main-nav">
        <a href="#" id="nav-home" class="nav-link"><span>首页</span></a>
        <a href="#" id="nav-products" class="nav-link"><span>商品</span></a>
        <a href="#" id="nav-cart" class="nav-link"><span>购物车</span></a>
        <a href="#" id="nav-orders" class="nav-link"><span>订单</span></a>
        <a href="#" id="nav-manage" class="nav-link" style="display:none;"><span>商品管理</span></a>
        <a href="#" id="nav-sales" class="nav-link" style="display:none;"><span>销售统计</span></a>
        <a href="#" id="nav-admin" class="nav-link" style="display:none;"><span>⚙️ 管理</span></a>
        <a href="#" id="nav-login" class="nav-link neon-btn"><span>登录</span></a>
        <a href="#" id="nav-register" class="nav-link neon-btn"><span>注册</span></a>
        <a href="#" id="nav-logout" class="nav-link neon-btn" style="display:none;"><span>注销</span></a>
      </nav>
    </div>
  </header>
  
  <!-- Hero with 3D effect -->
  <section class="hero" id="hero">
    <div class="hero-bg-animated"></div>
    <div class="hero-inner">
      <h1 class="hero-title" data-aos="zoom-in" data-aos-duration="1000">
        <span class="gradient-text glitch" data-text="探索你的专属好物">探索你的专属好物</span>
      </h1>
      <p class="hero-sub" data-aos="fade-up" data-aos-delay="200">精选商品 · 安全购物 · 极速发货</p>
      
      <!-- 搜索框 -->
      <div class="hero-search-container" data-aos="fade-up" data-aos-delay="300">
        <div class="hero-search-box">
          <input 
            type="text" 
            id="hero-search-input" 
            placeholder="🔍 搜索商品名称或描述..." 
          />
          <button id="hero-search-btn" class="neon-btn">
            搜索
          </button>
        </div>
      </div>
      
      <button class="hero-cta neon-btn pulse" id="hero-shop-btn" data-aos="fade-up" data-aos-delay="400">
        <span>开始浏览</span>
        <div class="btn-glow"></div>
      </button>
      <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
    </div>
  </section>
  
  <main id="main-content" class="container">
    <!-- 动态内容区域 -->
  </main>


  <!-- 登录弹窗 -->
  <div id="login-modal" class="modal" style="display:none;">
    <div class="modal-content qq-modal">
      <span class="close" id="close-login">&times;</span>
      <div class="qq-logo"></div>
      <h2 class="qq-title">账号登录</h2>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="用户名/邮箱" required><br>
        <input type="password" id="login-password" placeholder="密码" required><br>
        <button type="submit">登录</button>
        <div class="form-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- 注册弹窗 -->
  <div id="register-modal" class="modal" style="display:none;">
    <div class="modal-content qq-modal">
      <span class="close" id="close-register">&times;</span>
      <div class="qq-logo"></div>
      <h2 class="qq-title">账号注册</h2>
      <form id="register-form">
        <input type="text" id="register-username" placeholder="用户名" required><br>
        <input type="password" id="register-password" placeholder="密码（至少6位）" required><br>
        <input type="email" id="register-email" placeholder="邮箱" required><br>
        <div class="role-select-wrapper" style="margin-bottom: 20px; text-align: left;">
          <label style="display: block; color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 8px;">选择角色身份</label>
          <div class="role-options" style="display: flex; gap: 12px;">
            <label class="role-option" style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 12px; border: 2px solid rgba(148, 163, 184, 0.2); border-radius: 12px; cursor: pointer; transition: all 0.3s; color: var(--color-text);">
              <input type="radio" name="register-role" value="buyer" checked style="accent-color: var(--color-primary);">
              <span>🛒 用户</span>
            </label>
            <label class="role-option" style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 12px; border: 2px solid rgba(148, 163, 184, 0.2); border-radius: 12px; cursor: pointer; transition: all 0.3s; color: var(--color-text);">
              <input type="radio" name="register-role" value="seller" style="accent-color: var(--color-secondary);">
              <span>📦 销售</span>
            </label>
            <label class="role-option" style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 12px; border: 2px solid rgba(148, 163, 184, 0.2); border-radius: 12px; cursor: pointer; transition: all 0.3s; color: var(--color-text);">
              <input type="radio" name="register-role" value="admin" style="accent-color: var(--color-accent);">
              <span>👑 管理</span>
            </label>
          </div>
        </div>
        <button type="submit">注册</button>
        <div class="form-error" id="register-error"></div>
      </form>
    </div>
  </div>

  <!-- 发布商品弹窗 -->
  <div id="sell-modal" class="modal" style="display:none;">
    <div class="modal-content qq-modal" style="max-width: 600px;">
      <span class="close" id="close-sell">&times;</span>
      <div class="qq-logo">🛍️</div>
      <h2 class="qq-title">发布商品</h2>
      <form id="sell-form">
        <input type="text" id="sell-name" placeholder="商品名称" required><br>
        <textarea id="sell-description" placeholder="商品描述" rows="3" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #f1f5f9; font-family: inherit; margin-bottom: 15px; resize: vertical;" required></textarea>
        <input type="number" id="sell-price" placeholder="价格" step="0.01" min="0.01" required><br>
        <input type="number" id="sell-stock" placeholder="库存数量" min="1" required><br>
        
        <div class="upload-area-small" id="sell-upload-area" style="margin: 15px 0; padding: 30px; border: 2px dashed #1e90ff; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s;">
          <div style="font-size: 2rem; margin-bottom: 10px;">📷</div>
          <div style="color: #94a3b8; margin-bottom: 5px;">点击或拖拽上传商品图片</div>
          <div style="color: #64748b; font-size: 0.85rem;">支持 JPG、PNG、GIF、WEBP，最大 5MB</div>
        </div>
        <input type="file" id="sell-image" accept="image/*" style="display:none;" required>
        
        <div id="sell-image-preview" style="margin: 15px 0; text-align: center;"></div>
        
        <button type="submit" style="width: 100%;">发布商品</button>
        <div class="form-error" id="sell-error"></div>
        <div class="form-success" id="sell-success" style="color: #10b981; margin-top: 10px; display: none;"></div>
      </form>
    </div>
  </div>

  <!-- 编辑商品弹窗 -->
  <div id="edit-product-modal" class="modal" style="display:none;">
    <div class="modal-content qq-modal" style="max-width: 600px;">
      <span class="close" id="close-edit-product">&times;</span>
      <div class="qq-logo">✏️</div>
      <h2 class="qq-title">编辑商品</h2>
      <form id="edit-product-form">
        <input type="hidden" id="edit-product-id">
        <input type="text" id="edit-name" placeholder="商品名称" required><br>
        <textarea id="edit-description" placeholder="商品描述" rows="3" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #f1f5f9; font-family: inherit; margin-bottom: 15px; resize: vertical;" required></textarea>
        <input type="number" id="edit-price" placeholder="价格" step="0.01" min="0.01" required><br>
        <input type="number" id="edit-stock" placeholder="库存数量" min="0" required><br>
        
        <div class="upload-area-small" id="edit-upload-area" style="margin: 15px 0; padding: 30px; border: 2px dashed #1e90ff; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s;">
          <div style="font-size: 2rem; margin-bottom: 10px;">📸</div>
          <div style="color: #94a3b8; margin-bottom: 5px;">点击或拖拽更换商品图片</div>
          <div style="color: #64748b; font-size: 0.85rem;">（可选）支持 JPG、PNG、GIF、WEBP，最大 5MB</div>
        </div>
        <input type="file" id="edit-image" accept="image/*" style="display:none;">
        
        <div id="edit-image-preview" style="margin: 15px 0; text-align: center;"></div>
        
        <button type="submit" style="width: 100%;">保存修改</button>
        <div class="form-error" id="edit-error"></div>
        <div class="form-success" id="edit-success" style="color: #10b981; margin-top: 10px; display: none;"></div>
      </form>
    </div>
  </div>

  <footer class="site-footer glass-effect">
    <div class="footer-inner">
      <div class="footer-brand gradient-text">© 2025 购物网站 | 品质生活</div>
      <div class="footer-links">
        <a href="#" aria-label="关于我们" class="footer-link">关于</a>
        <a href="#" aria-label="帮助中心" class="footer-link">帮助</a>
        <a href="#" aria-label="隐私政策" class="footer-link">隐私</a>
      </div>
    </div>
    <div class="footer-wave">
      <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25"></path>
        <path d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z" opacity=".5"></path>
        <path d="M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z"></path>
      </svg>
    </div>
  </footer>
  
  <script>
    // Initialize Particles.js
    particlesJS('particles-js', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: '#1e90ff' },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#1e90ff', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: 'none', random: false, straight: false, out_mode: 'out', bounce: false }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
        modes: { repulse: { distance: 100, duration: 0.4 }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
    
    // Initialize AOS
    AOS.init({ duration: 800, once: true, offset: 100 });
  </script>
</body>
</html>
