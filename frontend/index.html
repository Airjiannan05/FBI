<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>购物网站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>购物网站</h1>
    <nav>
      <a href="#" id="nav-home">首页</a>
      <a href="#" id="nav-products">商品</a>
      <a href="#" id="nav-cart">购物车</a>
      <a href="#" id="nav-orders">订单</a>
      <a href="#" id="nav-login">登录</a>
      <a href="#" id="nav-register">注册</a>
      <a href="#" id="nav-logout" style="display:none;">注销</a>
    </nav>
  </header>
  <main id="main-content">
    <!-- 动态内容区域 -->
  </main>

  <!-- 登录弹窗 -->
  <div id="login-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" id="close-login">&times;</span>
      <h2>登录</h2>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="用户名" required><br>
        <input type="password" id="login-password" placeholder="密码" required><br>
        <button type="submit">登录</button>
        <div class="form-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- 注册弹窗 -->
  <div id="register-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" id="close-register">&times;</span>
      <h2>注册</h2>
      <form id="register-form">
        <input type="text" id="register-username" placeholder="用户名" required><br>
        <input type="password" id="register-password" placeholder="密码" required><br>
        <input type="email" id="register-email" placeholder="邮箱" required><br>
        <button type="submit">注册</button>
        <div class="form-error" id="register-error"></div>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
