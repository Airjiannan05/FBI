<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片上传测试 - OSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #f1f5f9;
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #1e90ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .upload-section {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 30px;
    }
    
    h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #60a5fa;
    }
    
    .upload-area {
      border: 2px dashed #1e90ff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }
    
    .upload-area:hover {
      border-color: #60a5fa;
      background: rgba(30, 144, 255, 0.05);
    }
    
    .upload-area.dragover {
      background: rgba(30, 144, 255, 0.1);
      border-color: #a855f7;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .upload-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }
    
    .upload-text {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    
    .upload-hint {
      font-size: 0.9rem;
      color: #64748b;
    }
    
    button {
      padding: 12px 30px;
      background: transparent;
      border: 2px solid #1e90ff;
      color: #f1f5f9;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
      margin: 10px;
    }
    
    button:hover {
      background: #1e90ff;
      box-shadow: 0 0 20px rgba(30, 144, 255, 0.5);
      transform: translateY(-2px);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .preview-area {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .preview-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    
    .preview-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    
    .preview-item .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.9);
      border: none;
      color: white;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      margin: 0;
    }
    
    .preview-item .url-display {
      padding: 10px;
      background: rgba(15, 23, 42, 0.5);
      font-size: 0.8rem;
      color: #94a3b8;
      word-break: break-all;
    }
    
    .result {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    
    .result h3 {
      color: #10b981;
      margin-bottom: 10px;
    }
    
    .result pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      color: #ef4444;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #60a5fa;
    }
    
    .loading.show {
      display: block;
    }
    
    .spinner {
      border: 3px solid rgba(30, 144, 255, 0.2);
      border-top: 3px solid #1e90ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ 图片上传到阿里云 OSS</h1>
    
    <!-- 单张图片上传 -->
    <div class="upload-section">
      <h2>📷 上传单张图片</h2>
      <div class="upload-area" id="singleUploadArea">
        <div class="upload-icon">☁️</div>
        <div class="upload-text">点击或拖拽图片到这里上传</div>
        <div class="upload-hint">支持 JPG、PNG、GIF、WEBP，最大 5MB</div>
      </div>
      <input type="file" id="singleFileInput" accept="image/*">
      <button onclick="uploadSingleImage()">上传图片</button>
      
      <div class="loading" id="singleLoading">
        <div class="spinner"></div>
        <div>正在上传...</div>
      </div>
      
      <div id="singleResult"></div>
      <div class="preview-area" id="singlePreview"></div>
    </div>
    
    <!-- 多张图片上传 -->
    <div class="upload-section">
      <h2>🖼️ 批量上传图片</h2>
      <div class="upload-area" id="multipleUploadArea">
        <div class="upload-icon">☁️☁️☁️</div>
        <div class="upload-text">点击或拖拽多张图片到这里上传</div>
        <div class="upload-hint">一次最多上传 10 张，每张最大 5MB</div>
      </div>
      <input type="file" id="multipleFileInput" accept="image/*" multiple>
      <button onclick="uploadMultipleImages()">批量上传</button>
      <button onclick="clearMultipleFiles()">清空选择</button>
      
      <div class="loading" id="multipleLoading">
        <div class="spinner"></div>
        <div>正在上传...</div>
      </div>
      
      <div id="multipleResult"></div>
      <div class="preview-area" id="multiplePreview"></div>
    </div>
  </div>
  
  <script>
    let singleFile = null;
    let multipleFiles = [];
    
    // 单张图片上传区域
    const singleUploadArea = document.getElementById('singleUploadArea');
    const singleFileInput = document.getElementById('singleFileInput');
    
    singleUploadArea.onclick = () => singleFileInput.click();
    
    singleFileInput.onchange = (e) => {
      singleFile = e.target.files[0];
      previewSingleImage(singleFile);
    };
    
    // 拖拽上传 - 单张
    singleUploadArea.ondragover = (e) => {
      e.preventDefault();
      singleUploadArea.classList.add('dragover');
    };
    
    singleUploadArea.ondragleave = () => {
      singleUploadArea.classList.remove('dragover');
    };
    
    singleUploadArea.ondrop = (e) => {
      e.preventDefault();
      singleUploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        singleFile = e.dataTransfer.files[0];
        previewSingleImage(singleFile);
      }
    };
    
    // 多张图片上传区域
    const multipleUploadArea = document.getElementById('multipleUploadArea');
    const multipleFileInput = document.getElementById('multipleFileInput');
    
    multipleUploadArea.onclick = () => multipleFileInput.click();
    
    multipleFileInput.onchange = (e) => {
      multipleFiles = Array.from(e.target.files);
      previewMultipleImages(multipleFiles);
    };
    
    // 拖拽上传 - 多张
    multipleUploadArea.ondragover = (e) => {
      e.preventDefault();
      multipleUploadArea.classList.add('dragover');
    };
    
    multipleUploadArea.ondragleave = () => {
      multipleUploadArea.classList.remove('dragover');
    };
    
    multipleUploadArea.ondrop = (e) => {
      e.preventDefault();
      multipleUploadArea.classList.remove('dragover');
      multipleFiles = Array.from(e.dataTransfer.files);
      previewMultipleImages(multipleFiles);
    };
    
    // 预览单张图片
    function previewSingleImage(file) {
      const preview = document.getElementById('singlePreview');
      const reader = new FileReader();
      
      reader.onload = (e) => {
        preview.innerHTML = `
          <div class="preview-item">
            <img src="${e.target.result}" alt="预览">
            <div class="url-display">准备上传: ${file.name}</div>
          </div>
        `;
      };
      
      reader.readAsDataURL(file);
    }
    
    // 预览多张图片
    function previewMultipleImages(files) {
      const preview = document.getElementById('multiplePreview');
      preview.innerHTML = '';
      
      files.forEach((file, index) => {
        const reader = new FileReader();
        
        reader.onload = (e) => {
          const div = document.createElement('div');
          div.className = 'preview-item';
          div.innerHTML = `
            <img src="${e.target.result}" alt="预览">
            <button class="remove-btn" onclick="removeFile(${index})">×</button>
            <div class="url-display">准备上传: ${file.name}</div>
          `;
          preview.appendChild(div);
        };
        
        reader.readAsDataURL(file);
      });
    }
    
    // 移除选中的文件
    function removeFile(index) {
      multipleFiles.splice(index, 1);
      previewMultipleImages(multipleFiles);
    }
    
    // 清空多文件选择
    function clearMultipleFiles() {
      multipleFiles = [];
      multipleFileInput.value = '';
      document.getElementById('multiplePreview').innerHTML = '';
      document.getElementById('multipleResult').innerHTML = '';
    }
    
    // 上传单张图片
    async function uploadSingleImage() {
      if (!singleFile) {
        alert('请先选择图片');
        return;
      }
      
      const loading = document.getElementById('singleLoading');
      const resultDiv = document.getElementById('singleResult');
      
      try {
        loading.classList.add('show');
        resultDiv.innerHTML = '';
        
        const formData = new FormData();
        formData.append('file', singleFile);
        formData.append('folder', 'products');
        
        const response = await fetch('/api/upload/image', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.innerHTML = `
            <div class="result">
              <h3>✓ 上传成功！</h3>
              <p>图片 URL：</p>
              <pre>${data.url}</pre>
              <button onclick="copyToClipboard('${data.url}')">复制 URL</button>
            </div>
          `;
          
          // 更新预览
          document.getElementById('singlePreview').innerHTML = `
            <div class="preview-item">
              <img src="${data.url}" alt="上传成功">
              <div class="url-display">${data.url}</div>
            </div>
          `;
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="error">
            <h3>✗ 上传失败</h3>
            <p>${error.message}</p>
          </div>
        `;
      } finally {
        loading.classList.remove('show');
      }
    }
    
    // 批量上传图片
    async function uploadMultipleImages() {
      if (multipleFiles.length === 0) {
        alert('请先选择图片');
        return;
      }
      
      const loading = document.getElementById('multipleLoading');
      const resultDiv = document.getElementById('multipleResult');
      
      try {
        loading.classList.add('show');
        resultDiv.innerHTML = '';
        
        const formData = new FormData();
        multipleFiles.forEach(file => {
          formData.append('files', file);
        });
        formData.append('folder', 'products');
        
        const response = await fetch('/api/upload/images', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.innerHTML = `
            <div class="result">
              <h3>✓ 批量上传成功！共上传 ${data.urls.length} 张图片</h3>
              <p>图片 URLs：</p>
              <pre>${JSON.stringify(data.urls, null, 2)}</pre>
              <button onclick="copyToClipboard('${JSON.stringify(data.urls)}')">复制所有 URLs</button>
            </div>
          `;
          
          // 更新预览
          const preview = document.getElementById('multiplePreview');
          preview.innerHTML = '';
          data.urls.forEach(url => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `
              <img src="${url}" alt="上传成功">
              <div class="url-display">${url}</div>
            `;
            preview.appendChild(div);
          });
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="error">
            <h3>✗ 上传失败</h3>
            <p>${error.message}</p>
          </div>
        `;
      } finally {
        loading.classList.remove('show');
      }
    }
    
    // 复制到剪贴板
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✓ 已复制到剪贴板');
      }).catch(() => {
        alert('✗ 复制失败，请手动复制');
      });
    }
  </script>
</body>
</html>
